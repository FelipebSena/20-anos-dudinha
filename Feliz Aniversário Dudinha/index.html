<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {

}

html, body {

  height: 100%;

}

body {

}

#c {

  inset: 0;
  width: 100%;
  height: 100%;

}

#titulo {

  left: 0;
  right: 0;

  flex-direction: column;
  align-items: center;

  font-weight: 300;
  text-align: center;
  opacity: 0;
  pointer-events: none;
}

#titulo .pre {
  font-size: clamp(0.72rem, 2.6vw, 1rem);
  font-weight: 500;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  padding-left: 0.5em;       /* compensa o espaçamento da última letra */
  color: var(--ouro);
}

#titulo .nome {
  font-size: clamp(3rem, 14vw, 6.5rem);
  font-style: italic;
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--texto);
  text-shadow: 0 0 28px var(--brilho);
}

#titulo .idade {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 0.45rem;
  margin-top: 0.5rem;
  font-size: clamp(1.3rem, 5vw, 2rem);
  font-style: italic;
  color: var(--ouro);
  text-shadow: 0 0 22px rgba(255, 50, 80, 0.4);
}

#titulo .idade b {
  font-weight: 300;
  font-size: 1.7em;
  line-height: 0.8;
  color: #ff4d66;
}

#titulo.show {
  animation: surgir 3.2s ease-out 3.6s forwards;
}

@keyframes surgir {
  from { opacity: 0; transform: translateY(10px); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
}

@media (prefers-reduced-motion: reduce) {
  #titulo.show { animation-duration: 0.01s; animation-delay: 0s; }
}

/* botão de som */
#som {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: max(14px, env(safe-area-inset-right, 0px));
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(243, 232, 214, 0.2);
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.35);
  color: rgba(243, 232, 214, 0.65);
  cursor: pointer;
  z-index: 3;
  transition: color 0.2s, border-color 0.2s;
}

#som[hidden] { display: none; }
#som:hover { color: #fff; border-color: rgba(255, 138, 152, 0.6); }
#som:focus-visible { outline: 2px solid var(--ouro); outline-offset: 3px; }
#som[aria-pressed="true"] .ondas { display: none; }
#som:not([aria-pressed="true"]) .corte { display: none; }

/* tela de início: o toque liga o som e a animação juntos */
#inicio {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.9rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: #000;
  text-align: center;
  font-family: 'Cormorant Garamond', 'Cormorant', Georgia, serif;
  transition: opacity 1s ease;
}

#inicio.oculto { opacity: 0; pointer-events: none; }

#inicio .bat {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ff4d66;
  box-shadow: 0 0 18px 4px rgba(255, 60, 90, 0.55), 0 0 60px 14px rgba(255, 40, 70, 0.25);
  animation: bater 1.6s ease-in-out infinite;
}

#inicio p {
  font-size: clamp(1.4rem, 5.5vw, 2rem);
  font-style: italic;
  font-weight: 300;
  color: var(--texto);
}

#inicio small {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: rgba(243, 232, 214, 0.38);
}

@keyframes bater {
  0%, 100% { transform: scale(1); opacity: 0.85; }
  18%      { transform: scale(1.5); opacity: 1; }
  36%      { transform: scale(1.05); opacity: 0.9; }
  52%      { transform: scale(1.35); opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  #inicio .bat { animation: none; }
  #inicio { transition-duration: 0.01s; }
}

    if (sprites[k]) return sprites[k];
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0.00, `hsla(${hk},${sk}%,97%,1)`);
    gr.addColorStop(0.16, `hsla(${hk},${sk}%,80%,0.92)`);
    gr.addColorStop(0.45, `hsla(${hk},${sk}%,62%,0.22)`);
    gr.addColorStop(1.00, `hsla(${hk},${sk}%,55%,0)`);
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return (sprites[k] = c);
  }

  // ---------- brilho em estrela (cruz de quatro pontas) ----------
  function estrela(h, s) {
    const hk = Math.round(h / 6) * 6;
    const sk = Math.round(Math.min(s, 50) / 10) * 10;   // estrelas mais claras
    const k = hk + '_' + sk;
    if (estrelas[k]) return estrelas[k];
    const c = document.createElement('canvas');
    c.width = c.height = 96;
    const g = c.getContext('2d');
    const cor = a => `hsla(${hk},${sk}%,94%,${a})`;

    function raio(comp, esp, angulo, alfa) {
      g.save();
      g.translate(48, 48);
      g.rotate(angulo);
      const lg = g.createLinearGradient(-comp, 0, comp, 0);
      lg.addColorStop(0.0, cor(0));
      lg.addColorStop(0.5, cor(alfa));
      lg.addColorStop(1.0, cor(0));
      g.fillStyle = lg;
      g.beginPath();
      g.ellipse(0, 0, comp, esp, 0, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }
    raio(47, 1.8, 0, 1);
    raio(47, 1.8, Math.PI / 2, 1);
    raio(24, 1.1, Math.PI / 4, 0.55);
    raio(24, 1.1, -Math.PI / 4, 0.55);

    const gr = g.createRadialGradient(48, 48, 0, 48, 48, 16);
    gr.addColorStop(0, cor(1));
    gr.addColorStop(0.35, cor(0.45));
    gr.addColorStop(1, cor(0));
    g.fillStyle = gr;
    g.fillRect(0, 0, 96, 96);
    return (estrelas[k] = c);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;

    // o coração ocupa só a área livre acima do texto
    const baseTexto = parseFloat(getComputedStyle(titulo).bottom) || H * 0.07;
    const topoTexto = H - baseTexto - titulo.offsetHeight;
    const margemTopo = Math.max(24, H * 0.05);
    const livre = topoTexto - margemTopo - H * 0.035;
    R = Math.max(60, Math.min(W * 0.36, H * 0.29, livre / 1.9));
    cy = margemTopo + 0.78 * R + Math.max(0, livre - 1.8 * R) * 0.4;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  const ease = {
    outCubic: x => 1 - Math.pow(1 - x, 3),
    inOutCubic: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);

  // paleta contida para as fagulhas: [tom, saturação]
  const PALETA = [[356, 88], [356, 88], [352, 92], [4, 90], [350, 35]];

  // ---------- fagulhas (rajadas de fogos) ----------
  function rajada(x, y, qtd, cor, vel, tamanho) {
    for (let i = 0; i < qtd; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = Math.pow(Math.random(), 0.55) * vel;
      const c = cor || PALETA[Math.floor(Math.random() * PALETA.length)];
      fagulhas.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        h: c[0], s: c[1],
        vida: rnd(1.1, 2.2),
        idade: 0,
        size: rnd(0.6, 1) * (tamanho || 14),
      });
    }
  }

  function iniciar() {
    resize();
    t0 = performance.now();
    ultimo = t0;
    ultimaRajada = 0;
    acumGlitter = 0;
    explodiu = false;
    fagulhas = [];

    titulo.classList.remove('show');
    void titulo.offsetWidth;          // reinicia a animação do texto
    titulo.classList.add('show');

    particulas = window.PONTOS.map(([x, y, h, size, s]) => ({
      tx: x, ty: y, h, s, size,
      ang: Math.random() * Math.PI * 2,
      raio: Math.pow(Math.random(), 0.5) * Math.min(W, H) * 0.5,
      atraso: Math.random() * 0.9,
      fase: Math.random() * Math.PI * 2,
      // movimento próprio e cintilação de cada ponto
      fx: rnd(0.5, 1.4), fy: rnd(0.5, 1.4),
      f1: rnd(0, 6.28), f2: rnd(0, 6.28),
      vel: rnd(1.4, 3.8),
      estrela: Math.random() < 0.2,
    }));
  }

  function quadro(agora) {
    // antes do toque inicial a tela fica preta, esperando
    if (!comecou) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      requestAnimationFrame(quadro);
      return;
    }
    const t = (agora - t0) / 1000;
    const dt = Math.min((agora - ultimo) / 1000, 0.05);
    ultimo = agora;

    // rastro longo: escurece devagar o quadro anterior
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // ---- foguete subindo ----
    if (t < T_EXPLOSAO) {
      const p = t / T_EXPLOSAO;
      const e = 1 - Math.pow(1 - p, 2);
      const x = cx + Math.sin(t * 20) * 2 * (1 - p);
      const y = H + (cy - H) * e;
      ctx.globalAlpha = 1;
      ctx.drawImage(sprite(4, 80), x - 14, y - 14, 28, 28);
      if (Math.random() < 0.7) {
        fagulhas.push({ x, y, vx: rnd(-12, 12), vy: rnd(30, 80), h: 4, s: 85, vida: rnd(0.5, 0.9), idade: 0, size: rnd(6, 10) });
      }
    }

    // ---- explosão principal ----
    if (t >= T_EXPLOSAO && !explodiu) {
      explodiu = true;
      rajada(cx, cy, 140, [356, 90], Math.min(W, H) * 0.8, 12);
      rajada(cx, cy, 60, [350, 30], Math.min(W, H) * 0.55, 10);
    }

    // ---- partículas que formam o coração ----
    if (t >= T_EXPLOSAO) {
      const te = t - T_EXPLOSAO;
      let batida = 1;
      if (te > T_FORMADO) {
        const u = te - T_FORMADO;
        batida = 1 + 0.03 * Math.pow(Math.max(0, Math.sin(u * 3.2)), 4);
      }

      // faixa de luz que atravessa o coração na diagonal
      const centroOnda = ((te * 0.5) % 3.4) - 1.7;

      for (const p of particulas) {
        const b = ease.outCubic(clamp(te / 1.0, 0, 1));
        const bx = cx + Math.cos(p.ang) * p.raio * b;
        const by = cy + Math.sin(p.ang) * p.raio * b;

        const s = clamp((te - 1.1 - p.atraso) / 1.8, 0, 1);
        const es = ease.inOutCubic(s);

        // depois de formado, cada ponto flutua e o contorno ondula
        const rampa = clamp((te - (2.9 + p.atraso)) / 1.2, 0, 1);
        const onda3 = 1 + 0.014 * Math.sin(te * 1.5 + p.tx * 3.2 + p.ty * 2.4) * rampa;
        const amp = R * 0.022 * rampa;
        const ox = Math.sin(te * p.fx + p.f1) * amp;
        const oy = Math.cos(te * p.fy + p.f2) * amp;

        const tx = cx + p.tx * R * batida * onda3 + ox;
        const ty = cy + p.ty * R * batida * onda3 + oy;
        const x = bx + (tx - bx) * es;
        const y = by + (ty - by) * es;

        // brilho da faixa de luz neste ponto
        const d = (p.tx * 0.8 + p.ty * 0.6) - centroOnda;
        const luz = rampa > 0 ? Math.exp(-d * d * 14) : 0;

        let alfa = 0.95;
        if (s >= 1) {
          const tw = 0.5 + 0.5 * Math.sin(te * p.vel + p.fase);
          alfa = 0.3 + 0.7 * tw + luz * 0.7;
        }
        const tam = p.size * (6 + R / 70) * (s < 1 ? 1.2 : 1) * (1 + luz * 0.8);

        ctx.globalAlpha = clamp(alfa, 0.1, 1);
        ctx.drawImage(sprite(p.h, p.s), x - tam / 2, y - tam / 2, tam, tam);

        // alguns pontos cintilam como estrelas de quatro pontas
        if (p.estrela && s >= 1) {
          const pisca = Math.pow(Math.max(0, Math.sin(te * p.vel * 0.7 + p.fase)), 6);
          const brilho = Math.max(pisca, luz * 0.9);
          if (brilho > 0.04) {
            const ts = (14 + R / 16) * (0.35 + 0.65 * brilho);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(p.fase + te * 0.25);
            ctx.globalAlpha = clamp(brilho, 0, 1);
            ctx.drawImage(estrela(p.h, p.s), -ts / 2, -ts / 2, ts, ts);
            ctx.restore();
          }
        }
      }

      // purpurina que se solta do coração e cai devagar
      if (te > T_FORMADO * 0.85) {
        acumGlitter += dt * 38;
        while (acumGlitter >= 1) {
          acumGlitter -= 1;
          const p = particulas[(Math.random() * particulas.length) | 0];
          fagulhas.push({
            x: cx + p.tx * R, y: cy + p.ty * R,
            vx: rnd(-8, 8), vy: rnd(2, 18),
            h: p.h, s: p.s,
            vida: rnd(1.4, 2.8), idade: 0,
            size: rnd(5, 10),
            g: 16, pisca: rnd(7, 16), fase: rnd(0, 6.28),
          });
        }
      }

      // rajadas discretas ao redor, depois que o coração se formou
      if (te > T_FORMADO && t - ultimaRajada > 1.8) {
        ultimaRajada = t;
        const x = rnd(W * 0.08, W * 0.92);
        const y = rnd(H * 0.07, H * 0.5);
        rajada(x, y, 55, null, Math.min(W, H) * rnd(0.16, 0.26), 11);
      }
    }

    // ---- fagulhas ----
    for (let i = fagulhas.length - 1; i >= 0; i--) {
      const f = fagulhas[i];
      f.idade += dt;
      if (f.idade >= f.vida) { fagulhas.splice(i, 1); continue; }
      f.vx *= 0.984;
      f.vy = f.vy * 0.984 + (f.g !== undefined ? f.g : 70) * dt;   // gravidade leve
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      const vida = 1 - f.idade / f.vida;
      let a = vida * (0.65 + 0.35 * Math.random());
      if (f.pisca) a = vida * (0.3 + 0.7 * Math.max(0, Math.sin(f.idade * f.pisca + f.fase)));
      ctx.globalAlpha = a;
      const tam = f.size * (0.5 + vida * 0.6);
      ctx.drawImage(sprite(f.h, f.s), f.x - tam / 2, f.y - tam / 2, tam, tam);
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(quadro);
  }

  // ---------- música de fundo ----------
  const VOLUME = 0.85;
  let fade = null;

  function atualizarBotao() {
    const mudo = musica.muted || musica.paused;
    botaoSom.setAttribute('aria-pressed', mudo ? 'true' : 'false');
    botaoSom.setAttribute('aria-label', mudo ? 'Ligar a música' : 'Silenciar a música');
  }

  function subirVolume() {
    clearInterval(fade);
    let v = 0;
    musica.volume = 0;
    fade = setInterval(() => {
      v = Math.min(VOLUME, v + 0.04);
      musica.volume = v;
      if (v >= VOLUME) clearInterval(fade);
    }, 90);
  }

  function tocar() {
    const p = musica.play();
    if (p && p.then) {
      p.then(() => { subirVolume(); atualizarBotao(); })
       .catch(() => atualizarBotao());
    } else {
      atualizarBotao();
    }
  }

  // se o arquivo não carregar direto, tenta de novo por fetch
  musica.addEventListener('error', () => {
    fetch('musica.mp3')
      .then(r => r.blob())
      .then(b => { musica.src = URL.createObjectURL(b); if (comecou) tocar(); })
      .catch(() => {});
  }, { once: true });

  botaoSom.addEventListener('click', e => {
    e.stopPropagation();
    if (musica.paused) {
      musica.muted = false;
      tocar();
    } else {
      musica.muted = !musica.muted;
      atualizarBotao();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) musica.pause();
    else if (comecou && !musica.muted) tocar();
  });

  // ---------- começo: o primeiro toque liga o som e a animação juntos ----------
  function comecar() {
    comecou = true;
    iniciar();
    musica.muted = false;
    tocar();
    inicio.classList.add('oculto');
    botaoSom.hidden = false;
  }

  window.addEventListener('resize', resize);
  window.addEventListener('click', e => {
    if (!comecou) { comecar(); return; }
    if (e.target.closest && e.target.closest('#som')) return;
    rajada(e.clientX, e.clientY, 36, null, Math.min(W, H) * 0.18, 10);   // faísca onde tocou
  });

  resize();
  // a fonte do texto muda a altura dele: remede quando terminar de carregar
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  requestAnimationFrame(quadro);
})();

</script>

</body></html>
